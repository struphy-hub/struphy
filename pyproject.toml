[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "struphy"
version = "3.0.4"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Max Planck Institute for Plasma Physics" },
    { email = "stefan.possanner@ipp.mpg.de" },
    { email = "max.lindqvist@ipp.mpg.de" },
    { email = "eric.sonnendruecker@ipp.mpg.de" },
]
description = "Multi-model plasma physics package"
keywords = [
    "plasma physics, fusion, numerical modeling, partial differential equations, energetic particles",
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    'numpy',
    'cunumpy',
    'pyccel>=2.1',
    'feectools',
    'scipy',
    'h5py',
    'matplotlib',
    'pyyaml',
    'vtk',
    'tqdm',
    'argcomplete',
    'plotly',
    "pyvista",
    'pytest',
    'pytest-mpi',
    'pytest-testmon',
    'ruff>=0.15.0',
    'line_profiler',
    'scope-profiler>=0.1.7',
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
phys = [
    "gvec<=1.3.1, >=1.1.0",
    "desc-opt<=0.16.0",
]
dev = [
    "struphy[mpi]",
    "notebook",
    "autopep8",
    "isort",
    "flake8",
    "pylint",
    "ssort",
    "add-trailing-comma",
    "pre-commit",
    "nbstripout",
    "tabulate",
    "tomli-w",
    "kaleido",
    "pandas",
]
mpi = [
    "mpi4py<=4.1.1",
]
doc = [
    "struphy[phys]",
    "jupyter<=1.1.1",
    "nbconvert<=6.5.4",
    "ipykernel<=7.2.0",
    "sphinx<=9.1.0",
    "sphinx-design<=0.7.0",
    "lxml_html_clean<=0.4.4",
    "sphinxcontrib-napoleon<=0.7",
    "sphinx-copybutton<=0.5.2",
    "pydata-sphinx-theme<=0.16.1",
    "nbsphinx<=0.9.8",
    "m2r2<=0.3.4",
    "myst-parser<=5.0.0",
    "mistune<=0.8.4",
    "docutils<=0.22.4",
    "ipyparallel<=9.0.2",
]
likwid = [
    "struphy[dev]",
    "pylikwid",
]
all = [
    "struphy[phys]",
    "struphy[dev]",
    "struphy[mpi]",
    "struphy[doc]",
    "struphy[likwid]",
]

[project.urls]
homepage = "https://struphy-hub.github.io/struphy/index.html"
documentation = "https://struphy-hub.github.io/struphy/index.html"
repository = "https://github.com/struphy-hub/struphy"
changelog = "https://github.com/struphy-hub/struphy/blob/devel/CHANGELOG.md"
"Bug Tracker" = "https://github.com/struphy-hub/struphy/issues"

[project.scripts]
struphy = "struphy.console.main:struphy"
kinetic-diagnostics = "struphy.diagnostics.console_diagn:main"

[tool.setuptools.package-data]
"struphy.fields_background.mhd_equil.eqdsk" = [
    "data/*.high",
]
"struphy.fields_background.mhd_equil.gvec" = [
    "run_01/*.dat",
    "run_01/*.ini",
    "run_02/*.dat",
    "run_02/*.ini",
    "run_03/*.dat",
    "run_03/*.ini",
    "run_03/*.nc",
]
struphy = [
    "compile_struphy.mk",
]

[tool.autopep8]
max_line_length = 120
ignore = [
    "E221,E226,E203,E265,E731,E711",
]

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E265",
    "E402",
    "E701",
    "E722",
    "E731",
    "E741",
    "E742",
    "E743",
    "E902",
    "F401",
    "F403",
    "F405",
    "D211",
    "D213",
    "F841",
]

[tool.pytest.ini_options]
markers = [
    "models",
    "fluid",
    "kinetic",
    "hybrid",
    "single",
]
