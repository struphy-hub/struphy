[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "struphy-plots"
version = "0.0.0"
description = "Optional plotting and diagnostics for labeled Struphy output"
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "xarray", "ipywidgets"]

[project.optional-dependencies]
pyvista = ["pyvista"]

[tool.setuptools.packages.find]
where = ["src"]
