name: PR - unit tests serial in Container

# Started on PRs only on request: see .github/workflows/ci-command.yml (/activate-ci)
# and ci-on-push.yml (every push to a PR with the ci-active label).
on:
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-serial:
    uses: ./.github/workflows/reusable-unit-testing.yml
    with:
      os: ubuntu-latest
      n-procs: 1
    secrets:
      ghcr-token: ${{ secrets.GHCR_TOKEN }}