name: PR - unit tests serial in Container

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-serial:
    uses: ./.github/workflows/reusable-unit-testing.yml
    with:
      os: ubuntu-latest
      n-procs: 1
    secrets:
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
