name: PR - dependency bounds freshness

on:
  pull_request:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check-managed-dependency-bounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check tooling
        run: |
          python -m pip install --upgrade pip

      - name: Check managed dependency bounds
        id: check
        run: |
          set +e
          python utils/check_dependency_bounds.py \
            --pyproject-file pyproject.toml \
            --optional-group phys \
            --version-scope major-minor \
            --report-file dependency-bounds-report.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add pull request metadata to report
        if: always()
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("dependency-bounds-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          head_repository = os.environ["HEAD_REPOSITORY"]
          base_repository = os.environ["BASE_REPOSITORY"]
          report["pull_request"] = {
              "base_ref": os.environ["BASE_REF"],
              "base_repository": base_repository,
              "head_ref": os.environ["HEAD_REF"],
              "head_repository": head_repository,
              "head_sha": os.environ["HEAD_SHA"],
              "number": os.environ["PR_NUMBER"],
              "same_repository": head_repository == base_repository,
          }
          report["automation"] = {
              "auto_update_allowed": head_repository == base_repository,
              "update_command": "pip install -U --update-strategy eager .[phys]",
              "update_script": "python utils/set_release_dependencies.py --optional-group phys",
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Summarize check result
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("dependency-bounds-report.json").read_text(encoding="utf-8"))
          summary_lines = [
              "## Managed dependency freshness",
              "",
              f"- Status: `{report['status']}`",
              f"- Version policy: `{report['version_scope']}`",
              f"- Optional groups: `{', '.join(report['scope']['optional_groups']) or '(none)'}`",
              "",
          ]

          if report["outdated"]:
              summary_lines.append("### Outdated bounds")
              summary_lines.append("")
              for item in report["outdated"]:
                  if item["kind"] == "missing-upper-bound":
                      summary_lines.append(
                          f"- `{item['dependency']}` in `{item['group']}` has no upper bound in `{item['requirement']}`"
                      )
                  else:
                      summary_lines.append(
                          f"- `{item['dependency']}` in `{item['group']}` is capped at `{item['upper_bound']}` while PyPI has `{item['latest_stable']}`"
                      )
              summary_lines.append("")

          if report["errors"]:
              summary_lines.append("### Errors")
              summary_lines.append("")
              for item in report["errors"]:
                  summary_lines.append(f"- `{item['kind']}`: {item['message']}")
              summary_lines.append("")

          if report["status"] == "outdated":
              if report["automation"]["auto_update_allowed"]:
                  summary_lines.append(
                      "A follow-up workflow will try to refresh `pyproject.toml` on this PR branch automatically."
                  )
              else:
                  summary_lines.append(
                      "This PR comes from a fork, so the follow-up workflow will not push changes back automatically."
                  )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary_lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dependency report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bounds-report
          path: dependency-bounds-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency freshness policy
        if: steps.check.outputs.exit_code != '0'
        run: exit ${{ steps.check.outputs.exit_code }}