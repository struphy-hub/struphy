name: PR - dependency bounds freshness

on:
  pull_request:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-managed-dependency-bounds:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check tooling
        run: |
          python -m pip install --upgrade pip

      - name: Check managed dependency bounds
        id: check
        run: |
          set +e
          python utils/check_dependency_bounds.py \
            --pyproject-file pyproject.toml \
            --optional-group phys \
            --version-scope major-minor
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize local remediation steps
        if: always()
        run: |
          {
            echo "## Managed dependency freshness"
            echo
            echo "- Version policy: major-minor"
            echo "- Optional groups: phys"
            echo
            if [[ "${{ steps.check.outputs.exit_code }}" != "0" ]]; then
              echo "### Local update instructions"
              echo
              echo "Run these commands locally to refresh bounds:"
              echo
              echo "1. python utils/check_dependency_bounds.py --pyproject-file pyproject.toml --optional-group phys --version-scope major-minor --report-file dependency-bounds-report.json"
              echo "2. python -m pip install --upgrade pip"
              echo "3. pip install tomli-w"
              echo "4. python utils/update_dependency_bounds.py --pyproject-file pyproject.toml --report-file dependency-bounds-report.json"
              echo "5. git add pyproject.toml && git commit -m \"Refresh managed dependency bounds\""
            else
              echo "Managed dependency bounds are in sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce dependency freshness policy
        if: steps.check.outputs.exit_code != '0'
        run: exit ${{ steps.check.outputs.exit_code }}