name: PR - dependency bounds freshness

on:
  pull_request:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}

      - name: Check workflow filters
        id: filter
        uses: ./.github/actions/commit-message-filter
        with:
          categories: tests,dependency-bounds
          event_name: ${{ github.event_name }}

  check-managed-dependency-bounds:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check tooling
        run: |
          python -m pip install --upgrade pip

      - name: Check managed dependency bounds
        id: check
        run: |
          set +e
          python utils/check_dependency_bounds.py
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize and enforce dependency freshness policy
        if: always()
        run: |
          {
            echo "## Managed dependency freshness"
            echo
            echo "- Version policy: major-minor"
            echo "- Optional groups: phys, mpi"
            echo
            if [[ "${{ steps.check.outputs.exit_code }}" != "0" ]]; then
              echo "### Local update instructions"
              echo
              echo "Run these commands locally to refresh bounds:"
              echo
              echo "python utils/check_dependency_bounds.py"
              echo "python -m pip install --upgrade pip"
              echo "pip install tomli-w"
              echo "python utils/update_dependency_bounds.py"
              echo "git add pyproject.toml && git commit -m \"Refresh managed dependency bounds\""
            else
              echo "Managed dependency bounds are in sync."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.check.outputs.exit_code }}" != "0" ]]; then
            exit "${{ steps.check.outputs.exit_code }}"
          fi