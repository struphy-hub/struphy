name: Create pull request into struphy-hub/struphy-examples

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clone-push-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Read Struphy version from pyproject
        uses: ./.github/actions/struphy-version

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: struphy-hub/struphy-examples
          token: ${{ secrets.STRUPHY_HUB_ACCESS_TOKEN }}
          path: struphy-examples

      - name: Copy examples and push new branch
        run: |
            cd struphy-examples
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b from-struphy-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }}
            # the submit_*.py scripts of the profiling cases need the profiling driver in profiling/,
            # which is not part of the examples repo;
            # --delete removes examples that were renamed or removed in struphy (excluded files are kept)
            rsync -a --delete \
              --exclude 'submit_*.py' --exclude '__pycache__' \
              --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude 'LICENSE' \
              ../examples/ ./
            git status
            git add -A
            git commit -m "Examples from struphy v${STRUPHY_VERSION} (on push to main)"
            git push origin from-struphy-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }}

      - name: Create version tag in struphy-examples
        run: |
            cd struphy-examples
            TAG_NAME="v${STRUPHY_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" > /dev/null; then
              echo "Tag ${TAG_NAME} already exists in origin. Skipping tag creation."
            else
              git tag -a "${TAG_NAME}" -m "Examples for Struphy v${STRUPHY_VERSION}"
              git push origin "${TAG_NAME}"
            fi

      - name: Create pull request
        run: |
          gh pr create \
            --repo struphy-hub/struphy-examples \
            --title "Examples from struphy v${STRUPHY_VERSION}" \
            --body "This is an auto-generated PR from a Struphy workflow (on push to main)." \
            --head from-struphy-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }} \
            --base main
        env:
          GH_TOKEN: ${{ secrets.STRUPHY_HUB_ACCESS_TOKEN }}
