name: PR - build, install and generate params

on:
  pull_request:
    branches:
      - devel
    # labeled: adding the ci-active label starts the full CI (see ci-command.yml)
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  # adding an unrelated label must not cancel a run in progress
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-active' && format('-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test-in-container-with-reqs:
    # on PRs only with the ci-active label (see ci-command.yml); a skipped job gets another name,
    # because a skipped job would otherwise count as a passed required check
    name: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-active') && (github.event.action != 'labeled' || github.event.label.name == 'ci-active'))) && 'test-in-container-with-reqs' || 'test-in-container-with-reqs (skipped, see /activate-ci)' }}
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-active') && (github.event.action != 'labeled' || github.event.label.name == 'ci-active'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-reqs:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}
    steps:

      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: fetch origin devel (for submodule-diff action)
        run: |
          pwd 
          ls -a
          git config --global --add safe.directory /__w/struphy/struphy
          git fetch --no-tags origin devel:refs/remotes/origin/devel
          git rev-parse --verify origin/devel

      - name: Build Struphy 
        run: |
          ls 
          python3 -m venv struphy_env
          source struphy_env/bin/activate
          pip install -U pip
          pip install -U build
          python3 -m build
          ls
          ls dist/

      - name: Install Struphy (according to README, but from .whl)
        run: |
          source struphy_env/bin/activate
          ls
          ls dist/
          pip install dist/*.whl
          pip list

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: struphy_env

      - name: Generate params
        shell: bash
        run: |
          source struphy_env/bin/activate
          struphy params Maxwell -y
          struphy params VlasovAmpereOneSpecies -y


      
