name: Reusable workflow for unit testing

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      n-procs:
        type: number
        default: 1
    secrets:
      ghcr-token:
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check memory
        run: |
          free -h
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo

  unit-tests-in-container-with-struphy:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: shard-1
            test_files: bsplines/tests/ console/tests/ fields_background/tests/ geometry/tests/ initial/tests/ kinetic_background/tests/ linear_algebra/tests/
          - shard: shard-2
            test_files: api/tests/ propagators/tests/ ode/tests/ polar/tests/ post_processing/tests/ dispersion_relations/tests/ io/tests/ simulation/tests/ models/tests/test_gpu_LinearVlasovAmpereOneSpecies.py models/tests/test_gpu_VlasovAmpereOneSpecies.py models/tests/test_scalars.py models/tests/test_splitting_order.py
          - shard: shard-3
            test_files: feec/tests/
          - shard: shard-4
            test_files: pic/tests/  

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.ghcr-token }}

    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Memory inside container
        run: |
          free -h
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Set environment for serial run
        if: inputs.n-procs == 1
        run: |
          {
            echo 'TESTMON_KEY=testmon-unit'
            echo 'RUN_MAXWELL='
            echo 'UNINSTALL_MPI=pip uninstall -y mpi4py'
            echo 'PYTEST_CMD=pytest -v --testmon'
          } >> "$GITHUB_ENV"

      - name: Set environment for mpi run
        if: inputs.n-procs > 1
        run: |
          {
            echo 'TESTMON_KEY=testmon-unit-mpi'
            echo 'RUN_MAXWELL=mpirun --oversubscribe -n 1 pytest -m single --testmon-forceselect -v --with-mpi --model-name Maxwell'
            echo 'UNINSTALL_MPI='
            echo 'PYTEST_CMD=mpirun --oversubscribe -n ${{ inputs.n-procs }} pytest -v --testmon --with-mpi'
          } >> "$GITHUB_ENV"

      - name: Check .testmondata 1
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Setup cache for testmon
        uses: actions/cache@v4
        with:
          path: |
            .testmondata-unit-${{ matrix.shard }}
          key: ${{ env.TESTMON_KEY }}-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }}
          restore-keys: |
            ${{ env.TESTMON_KEY }}-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.event.number }}-
            ${{ env.TESTMON_KEY }}-${{ matrix.shard }}-${{ github.ref_name }}
            ${{ env.TESTMON_KEY }}-${{ matrix.shard }}-devel

      - name: Check .testmondata 2
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container
      
      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_

      # testmon does not see changes in compiled kernels: run all tests then (FULL_RUN)
      - name: Changes testmon cannot see
        run: |
          bash .github/scripts/changes_testmon_cannot_see.sh /struphy_fortran_ "${{ github.event_name }}" \
            "${{ github.base_ref }}" "${{ github.event.before }}"

      - name: Run unit tests
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-unit-${{ matrix.shard }}
          TEST_FILES: ${{ matrix.test_files }}
          # oversubscribed threaded BLAS makes the MPI runs slow and their timing erratic (#743)
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set +e
          source /struphy_fortran_/env_fortran_/bin/activate || true
          set -e
          pip show struphy
          struphy compile --status
          echo "Running $UNINSTALL_MPI"
          $UNINSTALL_MPI
          # fingerprint only the core packages: the image is rebuilt with the latest dependencies on every push to
          # devel, and any of their updates made testmon re-run all tests
          TESTMON_IGNORE="testmon_ignore_dependencies=$(python .github/scripts/testmon_ignored_packages.py)"
          if [ "$FULL_RUN" = true ]; then TESTMON_SELECT=--testmon-noselect; else TESTMON_SELECT=; fi
          cd ${{ env.STRUPHY_PATH }}
          pwd
          if [ -n "$RUN_MAXWELL" ]; then
            echo "Running $RUN_MAXWELL"
            $RUN_MAXWELL -o "$TESTMON_IGNORE"
          fi
          git status || true
          echo "Running $PYTEST_CMD $TESTMON_SELECT $TEST_FILES"
          $PYTEST_CMD $TESTMON_SELECT -o "$TESTMON_IGNORE" $TEST_FILES

  # OpenMP build and checks, in parallel to the shards and only when relevant (see changes_testmon_cannot_see.sh)
  openmp-checks:
    name: OpenMP checks
    if: inputs.n-procs == 1
    runs-on: ${{ inputs.os }}

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.ghcr-token }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 5

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Changes testmon cannot see
        run: |
          bash .github/scripts/changes_testmon_cannot_see.sh /struphy_fortran_ "${{ github.event_name }}" \
            "${{ github.base_ref }}" "${{ github.event.before }}"

      - name: Compile all kernels with OpenMP
        if: env.OPENMP_RUN == 'true'
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_
          openmp: "true"

      - name: Check OpenMP numerical results
        if: env.OPENMP_RUN == 'true'
        env:
          OMP_NUM_THREADS: "4"
          OMP_DYNAMIC: "FALSE"
          OMP_STACKSIZE: "64M"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd "${{ env.STRUPHY_PATH }}"
          pytest -q pic/tests/test_openmp.py console/tests/test_compile.py
          pytest -q --pyargs feectools.linalg.tests.test_openmp
