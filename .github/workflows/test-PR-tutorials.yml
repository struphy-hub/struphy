name: PR - tutorial tests in Container

on:
  pull_request:
    branches:
      - devel
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}

      - name: Check workflow filters
        id: filter
        uses: ./.github/actions/commit-message-filter
        with:
          categories: tests,tutorials
          event_name: ${{ github.event_name }}

  check-submodule-changes:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Install Struphy in Container 
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule   
        if: env.SUBMOD_CHANGED == 'true' 
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_
      
      - name: Run tutorials
        env:
          PYVISTA_OFF_SCREEN: "true"
          PYVISTA_JUPYTER_BACKEND: "static"
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          ls /struphy_fortran_
          cd /struphy_fortran_/tutorials
          ls
          jupyter nbconvert --show-config
          jupyter nbconvert --execute --embed-images --to html tutorial_*.ipynb