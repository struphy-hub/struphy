name: PR - tutorial tests in Container

on:
  pull_request:
    branches:
      - devel
    # labeled: adding the ci-active label starts the full CI (see ci-command.yml)
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  # adding an unrelated label must not cancel a run in progress
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-active' && format('-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-submodule-changes:
    # on PRs only with the ci-active label (see ci-command.yml); a skipped job gets another name,
    # because a skipped job would otherwise count as a passed required check
    name: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-active') && (github.event.action != 'labeled' || github.event.label.name == 'ci-active'))) && 'check-submodule-changes' || 'check-submodule-changes (skipped, see /activate-ci)' }}
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-active') && (github.event.action != 'labeled' || github.event.label.name == 'ci-active'))
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Install Struphy in Container 
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule   
        if: env.SUBMOD_CHANGED == 'true' 
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_
      
      - name: Run tutorials
        env:
          PYVISTA_OFF_SCREEN: "true"
          PYVISTA_JUPYTER_BACKEND: "static"
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          pip uninstall -y gvec
          pip install gvec
          ls /struphy_fortran_
          cd /struphy_fortran_/tutorials
          ls
          jupyter nbconvert --show-config
          jupyter nbconvert --execute --embed-images --to html tutorial_*.ipynb