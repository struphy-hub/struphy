  #       uses: actions/checkout@v4

  #     - name: Code analysis with prospector
  #       run: |
  #         pip install prospector
  #         prospector src/ || true

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Code formatting with ruff
        run: |
          pip install ruff==0.15.0
          ruff check
      
