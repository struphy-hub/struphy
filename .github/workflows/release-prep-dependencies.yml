name: Prepare Release Dependency Bounds

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Branch or commit to prepare for release.
        required: true
        default: devel
      artifact-name:
        description: Artifact name containing the tested dependency snapshot.
        required: true
        default: tested-dependencies-models
  pull_request:
    branches:
      - devel
    paths:
      - .github/workflows/release-prep-dependencies.yml
      - .github/workflows/test-PR-models.yml
      - .github/workflows/check-release-dependency-bounds.yml
      - utils/set_release_dependencies.py
      - pyproject.toml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  prepare-release-dependency-bounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || github.sha }}
          fetch-depth: 0

      - name: Resolve workflow input defaults
        id: input-defaults
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source_ref=${{ inputs.source-ref }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=${{ inputs.artifact-name }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=tested-dependencies-models" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install tomli-w

      - name: Resolve tested model workflow run
        id: resolve-run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.input-defaults.outputs.artifact_name }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          import os
          import subprocess

          repository = os.environ["REPOSITORY"]
          source_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          artifact_name = os.environ["ARTIFACT_NAME"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          head_sha = os.environ.get("GITHUB_HEAD_SHA")

          def gh_json(path, query=None):
              command = ["gh", "api", path]
              if query:
                  for key, value in query.items():
                      command.extend(["-F", f"{key}={value}"])
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          if event_name == "pull_request":
              tested_sha = head_sha
              release_pr_number = os.environ.get("GITHUB_REF_NAME", "dry-run")
          else:
              pulls = gh_json(
                  f"repos/{repository}/commits/{source_sha}/pulls",
                  query={"per_page": "100", "state": "closed"},
              )
              release_pr = next(
                  (
                      pull
                      for pull in pulls
                      if pull.get("merged_at") and pull.get("base", {}).get("ref") == "devel"
                  ),
                  None,
              )
              if release_pr is None:
                  raise SystemExit(
                      f"Could not resolve a merged PR into devel for source commit {source_sha}."
                  )
              tested_sha = release_pr["head"]["sha"]
              release_pr_number = str(release_pr["number"])

          runs = gh_json(
              f"repos/{repository}/actions/workflows/test-PR-models.yml/runs",
              query={
                  "event": "pull_request",
                  "head_sha": tested_sha,
                  "per_page": "100",
                  "status": "success",
              },
          )["workflow_runs"]

          selected_run = None
          for run in runs:
              artifacts = gh_json(
                  f"repos/{repository}/actions/runs/{run['id']}/artifacts",
                  query={"per_page": "100"},
              )["artifacts"]
              if any(artifact["name"] == artifact_name for artifact in artifacts):
                  selected_run = run
                  break

          if selected_run is None:
              raise SystemExit(
                  f"Could not find a successful test-PR-models.yml pull_request run for tested SHA {tested_sha} with artifact {artifact_name}."
              )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"pr_number={release_pr_number}\n")
              handle.write(f"tested_sha={tested_sha}\n")
              handle.write(f"run_id={selected_run['id']}\n")
              handle.write(f"run_url={selected_run['html_url']}\n")
          PY

      - name: Download tested dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-prep/download
          gh run download "${{ steps.resolve-run.outputs.run_id }}" --name "${{ steps.input-defaults.outputs.artifact_name }}" --dir .release-prep/download
          test -f .release-prep/download/tested-dependencies-models.json

      - name: Copy tested dependency snapshot into repository
        run: |
          mkdir -p .github/release
          cp .release-prep/download/tested-dependencies-models.json .github/release/tested-dependencies.json

      - name: Validate tested dependency snapshot metadata
        env:
          EXPECTED_ARTIFACT_NAME: ${{ steps.input-defaults.outputs.artifact_name }}
          EXPECTED_INSTALL_COMMAND: pip install -U --upgrade-strategy eager -e ".[phys,mpi,doc]"
          EXPECTED_RUN_ID: ${{ steps.resolve-run.outputs.run_id }}
          EXPECTED_SOURCE_SHA: ${{ steps.resolve-run.outputs.tested_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('.github/release/tested-dependencies.json').read_text(encoding='utf-8'))
          metadata = payload.get('metadata', {})

          if metadata.get('artifact_name') != os.environ['EXPECTED_ARTIFACT_NAME']:
            raise SystemExit('Tested dependency snapshot artifact metadata does not match the requested artifact name.')
          if metadata.get('event_name') != 'pull_request':
            raise SystemExit('Tested dependency snapshot must originate from a pull_request run.')
          if metadata.get('pr_base_ref') != 'devel':
            raise SystemExit('Tested dependency snapshot must originate from a pull_request into devel.')
          if metadata.get('install_command') != os.environ['EXPECTED_INSTALL_COMMAND']:
            raise SystemExit('Tested dependency snapshot install command does not match the release-tested dependency policy.')
          if str(metadata.get('run_id')) != os.environ['EXPECTED_RUN_ID']:
            raise SystemExit('Tested dependency snapshot run id does not match the resolved workflow run id.')
          if metadata.get('source_sha') != os.environ['EXPECTED_SOURCE_SHA']:
            raise SystemExit('Tested dependency snapshot source sha does not match the resolved tested PR head sha.')
          PY

      - name: Update release dependency bounds
        run: |
          python utils/set_release_dependencies.py --versions-file .github/release/tested-dependencies.json

      - name: Detect repository changes
        id: diff
        run: |
          if git diff --quiet -- pyproject.toml .github/release/tested-dependencies.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release prep pull request
        if: github.event_name == 'workflow_dispatch' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/release-dependency-bounds
          base: main
          commit-message: "Prepare release dependency bounds"
          title: "Prepare release dependency bounds"
          body: |
            Updates the release dependency bounds from the tested dependency snapshot.

            Source ref: `${{ steps.input-defaults.outputs.source_ref }}`
            Source commit: `${{ steps.resolve-run.outputs.source_sha }}`
            Merged devel PR: `#${{ steps.resolve-run.outputs.pr_number }}`
            Tested PR head sha: `${{ steps.resolve-run.outputs.tested_sha }}`
            Test run id: `${{ steps.resolve-run.outputs.run_id }}`
            Test run url: `${{ steps.resolve-run.outputs.run_url }}`
            Artifact: `${{ steps.input-defaults.outputs.artifact_name }}`
          add-paths: |
            pyproject.toml
            .github/release/tested-dependencies.json

      - name: Report dry-run result
        if: github.event_name == 'pull_request'
        run: |
          echo "Dry-run mode: release-prep workflow validated resolution, snapshot checks, and pyproject updates without opening a release PR."