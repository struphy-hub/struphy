name: Nightly - update dependency bounds

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update-dependency-bounds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install update tooling
        run: |
          python -m pip install --upgrade pip
          pip install tomli-w

      - name: Check managed dependency bounds
        id: check
        run: |
          set +e
          python utils/check_dependency_bounds.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail on lookup/configuration errors
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "::error::check_dependency_bounds.py reported lookup/configuration errors, see the previous step's log."
          exit 1

      - name: Update dependency bounds
        if: steps.check.outputs.exit_code == '1'
        run: python utils/update_dependency_bounds.py

      - name: Open pull request with updated bounds
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if git diff --quiet -- pyproject.toml; then
            echo "No changes to pyproject.toml after update; skipping PR."
            exit 0
          fi

          BRANCH="bot/update-dependency-bounds"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pyproject.toml
          git commit -m "Update managed dependency bounds"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; branch updated with latest bounds."
          else
            gh pr create \
              --base devel \
              --head "$BRANCH" \
              --title "Update managed dependency bounds" \
              --body "Automated nightly refresh of dependency upper bounds via \`utils/update_dependency_bounds.py\`. Generated by the \`${{ github.workflow }}\` workflow."
          fi
