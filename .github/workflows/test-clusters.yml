name: Cluster workflow
on:
  push:
    branches:
      - protected-install-on-clusters
  # schedule:
  #   # run at 1 a.m. on Sunday
  #   - cron: "0 1 * * 0"
  # workflow_dispatch:

jobs:
  Raven:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "raven"]'
  
  Viper:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "viper"]'
  TOK:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "tok"]'
  
  Pitagora:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "pitagora"]'
