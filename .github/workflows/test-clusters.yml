name: Cluster workflow
on:
  # pull_request:
  #   branches:
  #     - devel
  # nightly schedule disabled: the self-hosted runners (Raven, Viper, Pitagora) did not pick up the jobs
  # (39 of 40 runs cancelled, Oct-Nov 2026); re-enable once the runners are back
  # schedule:
  #   - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  Raven:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "raven"]'
  
  Viper:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "viper"]'
  # TOK:
  #   uses: ./.github/workflows/reusable-clusters.yml
  #   with:
  #     runner_tags: '["self-hosted", "protected", "tok"]'
  
  Pitagora:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      runner_tags: '["self-hosted", "protected", "pitagora"]'
