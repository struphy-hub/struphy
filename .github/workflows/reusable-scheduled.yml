name: Reusable workflow for testing

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      should_run:
        required: false
        type: boolean
        default: true

jobs:
  test:
    if: inputs.should_run
    name: ${{ matrix.test-type }} (${{ matrix.compile-language }}, ${{ matrix.shard }})
    runs-on: ${{ inputs.os }}
    env:
      OMPI_MCA_rmaps_base_oversubscribe: 1 # Linux
      PRRTE_MCA_rmaps_base_oversubscribe: 1 # MacOS
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        compile-language: ["fortran", "c"]
        test-type: ["unit", "model", "verification"] #"quickstart", "tutorials"]
        shard: ["shard-1", "shard-2", "shard-3", "shard-4"]
        exclude:
          - test-type: model
            shard: shard-2
          - test-type: model
            shard: shard-3
          - test-type: model
            shard: shard-4
          - test-type: verification
            shard: shard-2
          - test-type: verification
            shard: shard-3
          - test-type: verification
            shard: shard-4

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # https://docs.github.com/en/actions/tutorials/build-and-test-code/python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      # Install prereqs
      # I don't think it's possible to use a single action for this because
      # we can't use ${inputs.os} in an if statement, so we have to use two different actions.
      - name: Install prerequisites (Ubuntu)
        if: inputs.os == 'ubuntu-latest'
        uses: ./.github/actions/install/ubuntu-latest

      - name: Install prerequisites (macOS)
        if: inputs.os == 'macos-latest'
        uses: ./.github/actions/install/macos-latest

      # Check that mpirun oversubscribing works, doesn't work unless OMPI_MCA_rmaps_base_oversubscribe==1
      - name: Test mpirun
        shell: bash
        run: |
          echo $OMPI_MCA_rmaps_base_oversubscribe
          echo $PRRTE_MCA_rmaps_base_oversubscribe
          pip install mpi4py -U
          which mpirun
          mpirun --version
          mpirun --oversubscribe --report-bindings -n 4 python -c "from mpi4py import MPI; comm=MPI.COMM_WORLD; print(f'Hello from rank {comm.Get_rank()} of {comm.Get_size()}'); assert comm.Get_size()==4"

      # Clone struphy-ci-testing
      - name: Install struphy
        uses: ./.github/actions/install/install-struphy
        with:
          optional-deps: 'mpi,phys'
        env:
          FC: ${{ env.FC }}
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}

      # Compile
      - name: Compile kernels
        uses: ./.github/actions/compile
        with:
          language: ${{ matrix.compile-language }}

      - name: Set environment for mpi run
        run: |
          {
            echo 'TESTMON_KEY=testmon-unit-mpi'
            echo 'RUN_MAXWELL=mpirun -n 1 pytest -m single --testmon-forceselect -v --with-mpi --model-name Maxwell'
            echo 'UNINSTALL_MPI='
            echo 'PYTEST_CMD=mpirun -n 2 pytest -v --testmon --with-mpi'
          } >> "$GITHUB_ENV"

      - name: Run unit tests with MPI
        if: matrix.test-type == 'unit'
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-unit-${{ matrix.shard }}
        run: |
          case "${{ matrix.shard }}" in
            shard-1)
              TEST_FILES="bsplines/tests/ console/tests/ fields_background/tests/ geometry/tests/ initial/tests/ kinetic_background/tests/ linear_algebra/tests/"
              ;;
            shard-2)
              TEST_FILES="propagators/tests/ ode/tests/ polar/tests/ post_processing/tests/"
              ;;
            shard-3)
              TEST_FILES="feec/tests/"
              ;;
            shard-4)
              TEST_FILES="pic/tests/"
              ;;
            *)
              echo "Unknown test shard: ${{ matrix.shard }}" >&2
              exit 1
              ;;
          esac
          set +e
          source /bin/activate || true
          set -e
          pip show struphy
          struphy compile --status
          cd ${{ env.STRUPHY_PATH }}
          pwd
          echo "Running $RUN_MAXWELL"
          $RUN_MAXWELL
          echo "Running $UNINSTALL_MPI"
          $UNINSTALL_MPI
          git status || true
          echo "Running $PYTEST_CMD $TEST_FILES"
          $PYTEST_CMD $TEST_FILES

      - name: Run model tests with MPI
        if: matrix.test-type == 'model' && matrix.shard == 'shard-1'
        shell: bash
        run: |
          mpirun -oversubscribe -n 2 pytest -x -m models --with-mpi $STRUPHY_PATH/models/tests/default_params/

      - name: Run verification tests with MPI
        if: matrix.test-type == 'verification' && matrix.shard == 'shard-1'
        shell: bash
        run: |
          mpirun --oversubscribe -n 2 pytest -x --with-mpi $STRUPHY_PATH/models/tests/verification/
