name: PR - unit tests with MPI in Container

on:
  pull_request:
    branches:
      - devel
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-test-with-mpi:
    name: Unit tests (${{ matrix.n-procs }} ranks)
    uses: ./.github/workflows/reusable-unit-testing.yml
    strategy:
      fail-fast: false
      matrix:
        n-procs: [2]
    with:
      os: ubuntu-latest
      n-procs: ${{ matrix.n-procs }}
    secrets:
      ghcr-token: ${{ secrets.GHCR_TOKEN }}

  pic-mpi-tests:
    name: Marked PIC MPI tests (${{ matrix.n-procs }} ranks)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n-procs: [1, 2, 4]

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 5

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Run marked PIC MPI tests
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd ${{ env.STRUPHY_PATH }}
          mpirun --oversubscribe -n ${{ matrix.n-procs }} pytest -v --with-mpi -m mpi_pic pic/tests
