name: PR - unit tests with MPI in Container

on:
  pull_request:
    branches:
      - devel
  # keeps the testmon data of devel (restored by new PRs) up to date
  push:
    branches:
      - devel
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-test-with-mpi:
    name: Unit tests (${{ matrix.n-procs }} ranks)
    uses: ./.github/workflows/reusable-unit-testing.yml
    strategy:
      fail-fast: false
      matrix:
        n-procs: [2]
    with:
      os: ubuntu-latest
      n-procs: ${{ matrix.n-procs }}
    secrets:
      ghcr-token: ${{ secrets.GHCR_TOKEN }}

  # one job for all rank counts: the setup (container, install, compile) took most of the time of each of the
  # former 4 matrix jobs; every rank count runs, failures are collected and reported at the end of each step
  pic-mpi-tests:
    name: Marked PIC MPI tests (1-4 ranks)
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 5

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        id: compile
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Run marked PIC MPI tests
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd ${{ env.STRUPHY_PATH }}
          FAILED=""
          for n in 1 2 3 4; do
            echo "::group::$n ranks"
            mpirun --oversubscribe -n $n pytest -v --with-mpi -m mpi_pic pic/tests || FAILED="$FAILED $n"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::failed on ranks:$FAILED"; exit 1; fi

      - name: Run the marker exchange on the fake CuPy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd ${{ env.STRUPHY_PATH }}
          FAILED=""
          for n in 1 2 3 4; do
            echo "::group::$n ranks"
            mpirun --oversubscribe -n $n env CUNUMPY_FAKE_CUPY=1 pytest -v --with-mpi pic/tests/test_sorting_device.py || FAILED="$FAILED $n"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::failed on ranks:$FAILED"; exit 1; fi

      - name: Run polar GPU MPI paths on the fake CuPy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd ${{ env.STRUPHY_PATH }}
          FAILED=""
          for n in 1 2 3 4; do
            echo "::group::$n ranks"
            mpirun --oversubscribe -n $n env CUNUMPY_FAKE_CUPY=1 pytest -v --with-mpi polar/tests/test_polar_cupy.py -k mpi_fake || FAILED="$FAILED $n"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::failed on ranks:$FAILED"; exit 1; fi

      - name: Run the end-to-end GPU model tests on the fake CuPy
        # 8 elements of degree 3: at most 2 ranks
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd ${{ env.STRUPHY_PATH }}
          FAILED=""
          for n in 1 2; do
            echo "::group::$n ranks"
            mpirun --oversubscribe -n $n env CUNUMPY_FAKE_CUPY=1 pytest -v --with-mpi models/tests/test_gpu_LinearVlasovAmpereOneSpecies.py models/tests/test_gpu_VlasovAmpereOneSpecies.py || FAILED="$FAILED $n"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::failed on ranks:$FAILED"; exit 1; fi

  # opens/updates a "CI failing" issue when a scheduled run or a run on devel fails
  report-failure:
    needs: [unit-test-with-mpi, pic-mpi-tests]
    if: ${{ failure() && contains(fromJSON('["schedule", "push"]'), github.event_name) }}
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-report-failure.yml
