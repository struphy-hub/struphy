name: Check Release Dependency Bounds

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-release-dependency-bounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install tomli-w

      - name: Check tested dependency snapshot exists
        run: |
          test -f .github/release/tested-dependencies.json

      - name: Validate tested dependency snapshot metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.github/release/tested-dependencies.json').read_text(encoding='utf-8'))
          metadata = payload.get('metadata', {})
          required_keys = [
              'artifact_name',
              'event_name',
              'install_command',
              'run_id',
              'source_sha',
              'workflow',
          ]

          missing = [key for key in required_keys if not metadata.get(key)]
          if missing:
              raise SystemExit(f'Missing tested dependency snapshot metadata fields: {missing}')
          if metadata['event_name'] != 'pull_request':
              raise SystemExit('Release dependency snapshot must originate from a pull_request run into devel.')
          if metadata.get('pr_base_ref') != 'devel':
              raise SystemExit('Release dependency snapshot must come from a pull_request targeting devel.')
          PY

      - name: Validate pyproject dependency bounds
        run: |
          python utils/set_release_dependencies.py --versions-file .github/release/tested-dependencies.json --check