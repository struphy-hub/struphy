name: PR - dependency bounds auto-update

on:
  workflow_run:
    # This trigger fires only after the referenced workflow run has completed.
    workflows:
      - PR - dependency bounds freshness
    types:
      - completed

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: write

jobs:
  refresh-managed-dependency-bounds:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download dependency report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .dependency-bounds
          gh run download "${{ github.event.workflow_run.id }}" --name dependency-bounds-report --dir .dependency-bounds

      - name: Decide whether auto-update should run
        id: decide
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".dependency-bounds/dependency-bounds-report.json").read_text(encoding="utf-8"))
          pull_request = report.get("pull_request", {})
          auto_update_allowed = report.get("automation", {}).get("auto_update_allowed", False)

          should_update = (
              os.environ["WORKFLOW_CONCLUSION"] == "failure"
              and report.get("status") == "outdated"
              and auto_update_allowed
          )

          if not should_update:
              if os.environ["WORKFLOW_CONCLUSION"] != "failure":
                  skip_reason = f"skip: triggering workflow concluded with {os.environ['WORKFLOW_CONCLUSION']}"
              elif report.get("status") != "outdated":
                  skip_reason = f"skip: report status is {report.get('status')}"
              elif not auto_update_allowed:
                  skip_reason = "skip: PR branch belongs to a fork"
              else:
                  skip_reason = "skip: no auto-update required"
          else:
              skip_reason = ""

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"should_update={'true' if should_update else 'false'}\n")
              handle.write(f"head_ref={pull_request.get('head_ref', '')}\n")
              handle.write(f"head_sha={pull_request.get('head_sha', '')}\n")
              handle.write(f"pr_number={pull_request.get('number', '')}\n")
              handle.write(f"skip_reason={skip_reason}\n")
          PY

      - name: Summarize decision
        run: |
          {
            echo "## Auto-update decision"
            echo
            echo "- should_update: ${{ steps.decide.outputs.should_update }}"
            if [[ "${{ steps.decide.outputs.should_update }}" != "true" ]]; then
              echo "- reason: ${{ steps.decide.outputs.skip_reason }}"
            else
              echo "- branch: ${{ steps.decide.outputs.head_ref }}"
              echo "- source sha: ${{ steps.decide.outputs.head_sha }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout PR branch
        if: steps.decide.outputs.should_update == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.decide.outputs.head_ref }}
          fetch-depth: 0

      - name: Verify branch head still matches triggering commit
        if: steps.decide.outputs.should_update == 'true'
        id: head-match
        run: |
          current_head=$(git rev-parse HEAD)
          if [[ "$current_head" == "${{ steps.decide.outputs.head_sha }}" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note branch head mismatch
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches != 'true'
        run: |
          {
            echo
            echo "The PR branch moved after the failing check run. Skipping this auto-update attempt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh managed dependency bounds in a clean environment
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches == 'true'
        run: |
          python -m venv .dependency-bounds-venv
          source .dependency-bounds-venv/bin/activate
          python -m pip install --upgrade pip
          pip install tomli-w
          pip install -U --update-strategy eager ".[phys]"
          python utils/set_release_dependencies.py --optional-group phys

      - name: Detect pyproject change
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches == 'true'
        id: diff
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed dependency bounds
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches == 'true' && steps.diff.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ steps.decide.outputs.head_ref }}
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Refresh managed dependency bounds for PR #${PR_NUMBER}"
          git push origin "HEAD:${HEAD_REF}"

      - name: Summarize refresh result
        if: steps.decide.outputs.should_update == 'true' && steps.head-match.outputs.matches == 'true'
        run: |
          {
            echo
            if [[ "${{ steps.diff.outputs.changed }}" == "true" ]]; then
              echo "Pushed an updated `pyproject.toml` to `${{ steps.decide.outputs.head_ref }}`."
              echo "The pull request checks should rerun from the new synchronize event."
            else
              echo "No `pyproject.toml` change was produced by the eager refresh step."
              echo "The branch still needs manual follow-up if the freshness check remains red."
            fi
          } >> "$GITHUB_STEP_SUMMARY"