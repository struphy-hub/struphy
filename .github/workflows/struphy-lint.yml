name: struphy lint

# Lints the whole repo with `struphy lint all`. Installing struphy makes this slow, so on PRs
# it only runs on request: see ci-command.yml (/activate-ci) and ci-on-push.yml.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  struphy_lint_all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install prerequisites (Ubuntu)
        uses: ./.github/actions/install/ubuntu-latest

      - name: Install struphy
        uses: ./.github/actions/install/install-struphy-editable

      - name: Reinstall feectools from submodule
        uses: ./.github/actions/install/feectools-submodule

      - name: Lint the repo
        run: |
          struphy lint all --output-format plain --verbose
