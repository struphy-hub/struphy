name: Cluster workflow
on:
  push:
    branches:
      - protected-install-on-clusters

jobs:
  raven-test:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      modules: "gcc/14 openmpi/5.0 python-waterboa/2025.06 cmake netcdf-serial mkl hdf5-serial"
      runner_tags: '["self-hosted", "protected", "raven"]'
  tok-test:
    uses: ./.github/workflows/reusable-clusters.yml
    with:
      modules: "gcc/14 openmpi/5.0 python-waterboa/2025.06 cmake/4.0 netcdf-serial/4.9.2 mkl/2025.1 hdf5-serial/2.0.0"
      runner_tags: '["self-hosted", "protected", "tok"]'
