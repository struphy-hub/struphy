      #     echo "hello"
      #     module list
      #     module avail
      #     module load python/3.11.7
      #     module list
      #     python --version
      
      # bash .github/scripts/install_and_test.sh "${{ matrix.compile-language }}"
      # - name: Say hello from cluster
      #   shell: bash
      #   run: |
      #     set -euxo pipefail

      #     echo "Hello from cluster!"
      #     pwd
      #     whoami
      #     hostname
      #     which bash
      #     which ssh
      #     python --version
      
      # - name: Print some information
      #   shell: bash
      #   run: |
      #     echo "Current date and time: $(date)"
      #     echo "Current user: $(whoami)"
      #     echo "Current working directory: $(pwd)"
      #     echo "List of files in the current directory:"
      #     ls -l
      #     echo "Python version:"
      #     python --version
      #     echo "SLURM job information:"
      #     squeue -u $(whoami)
      #     curl -fsSL https://raw.githubusercontent.com/max-models/whereami/main/install.sh | bash
      #     export PATH="${HOME}/.local/bin:${PATH}"
      #     whereami
      - name: Install struphy
        run: |
          source profiling/common_commands.sh

      - name: Submit SLURM job
        run: |          
          python profiling/submit_diocotron_job.py --venv-path .venv-fortran

      - name: Package profiling .h5 files
        run: |
          python profiling/package_profiling_results.py \
            --results-root profiling/results \
            --language "${{ matrix.compile-language }}" \
            --commit "${{ github.sha }}" \
            --output-root profiling-results-export

      - name: Push packaged profiling data to profiling-data main
        shell: bash
        run: |
          set -euo pipefail
          git clone git@github.com:struphy-hub/profiling-data.git profiling-data
          cp -R profiling-results-export/* profiling-data/
          cd profiling-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No profiling data changes to commit."
            exit 0
          fi
          git commit -m "Add profiling data (${GITHUB_SHA::8}, ${{ matrix.compile-language }})"
          git push origin main

      - name: Upload packaged profiling data as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results-export-${{ matrix.compile-language }}
          path: profiling-results-export
