name: Reusable workflow for testing

on:
  workflow_call:
    inputs:
      runner_tags:
        description: JSON array of runner labels
        required: true
        type: string

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

# defaults:
#   run:
#     shell: bash

jobs:
  test:
    # environment: protected
    runs-on: ${{ fromJSON(inputs.runner_tags) }}
    strategy:
      fail-fast: false
      matrix:
        compile-language: ["fortran"] #, "c"]
        # test-type: ["unit", "model", "verification"]

    steps:
      - name: Set strict shell options
        shell: bash
        run: |
          set -euo pipefail

      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Print some information
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/max-models/whereami/main/install.sh | bash
          export PATH="${HOME}/.local/bin:${PATH}"
          whereami
      - name: Install struphy
        run: |
          source profiling/common_commands.sh

      - name: Submit SLURM job and package profiling data
        run: |
          source .venv-fortran/bin/activate
          python profiling/submit_diocotron_job.py \
            --language ${{ matrix.compile-language }} \
            --compiler GNU \
            --output-root profiling-results-export

      - name: Upload packaged profiling data as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results-export-${{ matrix.compile-language }}
          path: profiling-results-export
