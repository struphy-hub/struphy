jobs:
  test:
    # environment: protected
    runs-on: ${{ fromJSON(inputs.runner_tags) }}
    strategy:
      fail-fast: false
      matrix:
        compile-language: ["fortran"] #, "c"]
        # test-type: ["unit", "model", "verification"]

    steps:
      - name: Set strict shell options
        shell: bash
        run: |
          set -euo pipefail

      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5
      
      # - name: Install and run tests
