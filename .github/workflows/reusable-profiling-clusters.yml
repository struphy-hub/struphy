name: Reusable workflow for testing

on:
  workflow_call:
    inputs:
      runner_tags:
        description: JSON array of runner labels
        required: true
        type: string

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

# defaults:
#   run:
#     shell: bash

jobs:
  test:
    # environment: protected
    runs-on: ${{ fromJSON(inputs.runner_tags) }}
    strategy:
      fail-fast: false
      matrix:
        compile-language: ["fortran"] #, "c"]
        # test-type: ["unit", "model", "verification"]

    steps:
      - name: Set strict shell options
        shell: bash
        run: |
          set -euo pipefail

      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Print some information
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/max-models/whereami/main/install.sh | bash
          export PATH="${HOME}/.local/bin:${PATH}"
          whereami
      
      - name: Create a virtual environment for Fortran
        shell: bash
        run: |
          LANGUAGE="fortran"
          module purge
          source ./setup/modules.sh load
          module list
          which python
          export VENV_NAME=".venv-$LANGUAGE"
          echo $VENV_NAME
          python --version
          if [ ! -d "$VENV_NAME" ]; then
              echo "Creating virtual environment '$VENV_NAME'"
              python -m venv "$VENV_NAME"
          else
              echo "Virtual environment '$VENV_NAME' already exists"
          fi
          source "$VENV_NAME/bin/activate"
          echo "Activated virtual environment"
      
      - name: Install dependencies
        shell: bash
        run: |
          source .venv-fortran/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall mpi4py -y
          pip install --no-binary=mpi4py mpi4py
          echo "Installed packages:"
          pip list

      - name: Verify struphy installation
        shell: bash
        run: |
          source .venv-fortran/bin/activate
          python -c "import struphy; print(struphy.__version__)"
          struphy --help
      
      - name: Verify MPI installation
        shell: bash
        run: |
          source .venv-fortran/bin/activate
          module list
          which mpiexec
          mpiexec --version
          mpirun --version
          python -c "from mpi4py import MPI; print('mpi4py import successful:', MPI)"
          echo
          echo "Running test with 4 MPI ranks:"
          mpirun --oversubscribe --report-bindings -n 4 python -c "
          from mpi4py import MPI
          comm = MPI.COMM_WORLD
          print(f'Hello from rank {comm.Get_rank()} of {comm.Get_size()}')
          assert comm.Get_size() == 4
          "

      - name: Submit SLURM job, package and push profiling data
        run: |
          source .venv-fortran/bin/activate
          python profiling/submit_diocotron_job.py \
            --language ${{ matrix.compile-language }} \
            --compiler GNU

      - name: Upload packaged profiling data as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results-export-${{ matrix.compile-language }}
          path: profiling-results-export
