name: MacOS

on:
  push:
    branches:
      - 13-move-each-model-to-its-own-file
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0" 
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-install-test:
    uses: ./.github/workflows/reusable-testing.yml
    with:
      os: macos-latest