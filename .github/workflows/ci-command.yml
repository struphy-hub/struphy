name: /activate-ci and /deactivate-ci commands

# The heavy PR jobs (test-PR-*.yml and struphy_lint_all in static_analysis.yml) only run on PRs
# that carry the "ci-active" label; until then their required checks stay "Expected". Users with
# write access can switch them on and off for a PR by commenting:
#
#   /activate-ci    add the "ci-active" label: the full CI runs now and on every later push
#   /deactivate-ci  remove the label: later pushes run only the quick checks again
#
# Adding or removing the label by hand does the same.
#
# A label added with the built-in GITHUB_TOKEN does not trigger other workflows. If the repository
# secret CI_COMMAND_TOKEN (a token with write access to pull requests) is set, /activate-ci uses it
# and the full CI starts immediately; otherwise it starts with the next push to the PR.
#
# This workflow never checks out or runs code from the pull request.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  activate-ci:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/activate-ci') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Add the ci-active label
        env:
          GH_TOKEN: ${{ secrets.CI_COMMAND_TOKEN || github.token }}
          HAS_CI_COMMAND_TOKEN: ${{ secrets.CI_COMMAND_TOKEN != '' }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh pr edit "$PR" --add-label ci-active
          gh api --method POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null
          if [ "$HAS_CI_COMMAND_TOKEN" != "true" ]; then
            gh pr comment "$PR" --body "Added \`ci-active\`: the full CI runs on the next push to this PR. (To start it right away, remove and re-add the label by hand, or set the \`CI_COMMAND_TOKEN\` secret so \`/activate-ci\` starts it immediately.)"
          fi

  deactivate-ci:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deactivate-ci') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Remove the ci-active label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh pr edit "$PR" --remove-label ci-active
          gh api --method POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content="+1" > /dev/null
