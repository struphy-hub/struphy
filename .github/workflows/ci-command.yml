name: /activate-ci and /deactivate-ci commands

# The heavy PR workflows (test-PR-*.yml, and the struphy_lint_all job of static_analysis.yml)
# only run their jobs on PRs that carry the "ci-active" label. Users with write access can
# switch them on and off for a PR by commenting:
#
#   /activate-ci    start the full workflows on the PR branch right away (via workflow_dispatch)
#                   and add the "ci-active" label, so every later push runs them too
#   /deactivate-ci  remove the label; later pushes run only the quick checks again
#                   (runs that already started keep going)
#
# This workflow never checks out or runs code from the pull request.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  activate-ci:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/activate-ci') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Start the full workflows on the PR branch and add the ci-active label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          head_repo=$(gh pr view "$PR" --json headRepository,headRepositoryOwner -q '.headRepositoryOwner.login + "/" + .headRepository.name')
          if [ "$head_repo" != "$GH_REPO" ]; then
            gh pr comment "$PR" --body "\`/activate-ci\` only works for branches in $GH_REPO; this PR comes from $head_repo."
            exit 1
          fi
          branch=$(gh pr view "$PR" --json headRefName -q .headRefName)

          for workflow in \
            test-PR-unit.yml \
            test-PR-unit-mpi.yml \
            test-PR-models.yml \
            test-PR-models-clones.yml \
            test-PR-pure-python.yml \
            test-PR-generate-params.yml \
            test-PR-examples.yml \
            test-PR-tutorials.yml \
            static_analysis.yml; do
            gh workflow run "$workflow" --ref "$branch"
          done

          gh pr edit "$PR" --add-label ci-active
          gh api --method POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null

  deactivate-ci:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deactivate-ci') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Remove the ci-active label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh pr edit "$PR" --remove-label ci-active
          gh api --method POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content="+1" > /dev/null
