name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - devel
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: read

concurrency:
  group: "docs-${{ github.ref }}"
  # never cancel a running GitHub Pages deployment
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install prerequisites (Ubuntu)
        uses: ./.github/actions/install/ubuntu-latest
        env:
          FC: ${{ env.FC }}
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}

      - name: Install Struphy (dev-doc)
        uses: ./.github/actions/install/install-struphy
        with:
          optional-deps: 'dev,doc'

      - name: Compile Struphy
        uses: ./.github/actions/compile

      - name: Build Sphinx docs
        env:
          # the deployed docs (main) keep the tutorials; PR builds skip them to save time
          STRUPHY_DOCS_SKIP_TUTORIALS: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '0' || '1' }}
        run: |
          cd doc
          make html

      - name: Upload built docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html/

  deploy-docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
