name: Scheduled MacOS

on:
  schedule:
    # run at 1 a.m. on Sundays and Wednesdays
    - cron: "0 1 * * 0" 
    - cron: "0 1 * * 3" 
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-install-test:
    uses: ./.github/workflows/reusable-scheduled.yml
    with:
      os: macos-latest

  # opens/updates a "CI failing" issue when a scheduled run or a run on devel fails
  report-failure:
    needs: [macos-install-test]
    if: ${{ failure() && contains(fromJSON('["schedule", "push"]'), github.event_name) }}
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-report-failure.yml
