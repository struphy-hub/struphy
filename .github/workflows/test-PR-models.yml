name: PR - model tests in Container

on:
  pull_request:
    branches:
      - devel
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  model-tests-in-container-with-struphy:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Check .testmondata 1
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Setup cache for testmon
        uses: actions/cache@v4
        with:
          path: |
            .testmondata-model
            .testmondata-model-mpi
          key: testmon-model-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }}
          restore-keys: |
            testmon-model-${{ github.ref_name }}-${{ github.event.number }}-
            testmon-model-${{ github.ref_name }}
            testmon-model-devel
            testmon-model-

      - name: Check .testmondata 2
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: LinearMHD test
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          pytest -m single -xvs --model-name LinearMHD $STRUPHY_PATH

      - name: Model tests
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          pytest -x -m models --testmon-forceselect  /struphy_fortran_/src/struphy/models/tests/default_params/ 

      - name: Verification tests
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd /struphy_fortran_/src/struphy
          pytest -x --testmon models/tests/verification/

      - name: Model tests with MPI
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model-mpi
        # init .testmondata with non-MPI call
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          mpirun -n 1 pytest -m single --testmon-forceselect -xs --with-mpi --model-name Maxwell /struphy_fortran_/src/struphy
          mpirun -oversubscribe -n 2 pytest -x -m models --testmon-forceselect --with-mpi  /struphy_fortran_/src/struphy/models/tests/default_params/

      - name: Verification tests with 2 MPI
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model-mpi
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          mpirun --oversubscribe -n 2 pytest -x --testmon --with-mpi  /struphy_fortran_/src/struphy/models/tests/verification/

      - name: Record tested dependency snapshot
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd /struphy_fortran_
          python utils/set_release_dependencies.py --write-versions-file "$GITHUB_WORKSPACE/tested-dependencies-models.json"

      - name: Add snapshot metadata
        shell: bash
        env:
          SNAPSHOT_PATH: ${{ github.workspace }}/tested-dependencies-models.json
          SNAPSHOT_ARTIFACT_NAME: tested-dependencies-models
          SNAPSHOT_EVENT_NAME: ${{ github.event_name }}
          SNAPSHOT_PR_NUMBER: ${{ github.event.pull_request.number }}
          SNAPSHOT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SNAPSHOT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SNAPSHOT_GIT_SHA: ${{ github.sha }}
          SNAPSHOT_REF_NAME: ${{ github.ref_name }}
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
          SNAPSHOT_RUN_ATTEMPT: ${{ github.run_attempt }}
          SNAPSHOT_WORKFLOW: ${{ github.workflow }}
          SNAPSHOT_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          snapshot_path = Path(os.environ["SNAPSHOT_PATH"])
          payload = json.loads(snapshot_path.read_text(encoding="utf-8"))

          metadata = {
              "artifact_name": os.environ["SNAPSHOT_ARTIFACT_NAME"],
              "event_name": os.environ["SNAPSHOT_EVENT_NAME"],
              "install_command": 'pip install -U -e ".[phys,mpi,doc]"',
              "pr_base_ref": os.environ.get("SNAPSHOT_PR_BASE_REF") or None,
              "pr_head_ref": os.environ.get("SNAPSHOT_PR_HEAD_REF") or None,
              "pr_head_sha": os.environ.get("SNAPSHOT_PR_HEAD_SHA") or None,
              "pr_number": os.environ.get("SNAPSHOT_PR_NUMBER") or None,
              "ref_name": os.environ["SNAPSHOT_REF_NAME"],
              "repository": os.environ["SNAPSHOT_REPOSITORY"],
              "run_attempt": os.environ["SNAPSHOT_RUN_ATTEMPT"],
              "run_id": os.environ["SNAPSHOT_RUN_ID"],
              "source_sha": os.environ.get("SNAPSHOT_PR_HEAD_SHA") or os.environ["SNAPSHOT_GIT_SHA"],
              "workflow": os.environ["SNAPSHOT_WORKFLOW"],
              "workflow_url": f"{os.environ['SNAPSHOT_SERVER_URL']}/{os.environ['SNAPSHOT_REPOSITORY']}/actions/runs/{os.environ['SNAPSHOT_RUN_ID']}",
          }

          payload["metadata"] = metadata
          snapshot_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload tested dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tested-dependencies-models
          path: ${{ github.workspace }}/tested-dependencies-models.json
          if-no-files-found: error