name: PR - model tests in Container

on:
  pull_request:
    branches:
      - devel
  schedule:
    # run at 1 a.m. on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}

      - name: Check workflow filters
        id: filter
        uses: ./.github/actions/commit-message-filter
        with:
          categories: tests,models
          event_name: ${{ github.event_name }}

  model-tests-in-container-with-struphy:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: spossann
        password: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true  # This is crucial!
          fetch-depth: 5

      - name: Check .testmondata 1
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Setup cache for testmon
        uses: actions/cache@v4
        with:
          path: |
            .testmondata-model
            .testmondata-model-mpi
          key: testmon-model-${{ github.ref_name }}-${{ github.event.number }}-${{ github.run_number }}
          restore-keys: |
            testmon-model-${{ github.ref_name }}-${{ github.event.number }}-
            testmon-model-${{ github.ref_name }}
            testmon-model-devel
            testmon-model-

      - name: Check .testmondata 2
        run: |
          ls .testmon* || echo "No .testmondata"

      - name: Install Struphy in Container
        uses: ./.github/actions/install/struphy_in_container

      - name: Get submodule diff
        uses: ./.github/actions/submodule-diff
        with:
          start-dir: /struphy_fortran_

      - name: Reinstall feectools from submodule
        if: env.SUBMOD_CHANGED == 'true'
        uses: ./.github/actions/install/feectools-submodule
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: Compile Struphy
        uses: ./.github/actions/compile
        with:
          env-name: /struphy_fortran_/env_fortran_

      - name: LinearMHD test
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          pytest -m single -xvs --model-name LinearMHD $STRUPHY_PATH

      - name: Model tests
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          pytest -x -m models --testmon-forceselect  /struphy_fortran_/src/struphy/models/tests/default_params/ 

      - name: Verification tests
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          cd /struphy_fortran_/src/struphy
          pytest -x --testmon models/tests/verification/

      - name: Model tests with MPI
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model-mpi
        # init .testmondata with non-MPI call
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          mpirun -n 1 pytest -m single --testmon-forceselect -xs --with-mpi --model-name Maxwell /struphy_fortran_/src/struphy
          mpirun -oversubscribe -n 2 pytest -x -m models --testmon-forceselect --with-mpi  /struphy_fortran_/src/struphy/models/tests/default_params/

      - name: Verification tests with 2 MPI
        shell: bash
        env:
          TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-model-mpi
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          mpirun --oversubscribe -n 2 pytest -x --testmon --with-mpi  /struphy_fortran_/src/struphy/models/tests/verification/