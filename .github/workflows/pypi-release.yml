name: Publish Struphy to PyPI

on:
  push:
    branches:
      - main

# .github/workflows/ci-cd.yml
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}

      - name: Check workflow filters
        id: filter
        uses: ./.github/actions/commit-message-filter
        with:
          categories: release,pypi
          event_name: ${{ github.event_name }}

  pypi-publish:
    name: Upload release to PyPI
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/struphy/

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build the package
      run: python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # with:
        # repository-url: https://test.pypi.org/legacy/