name: "Install Struphy in Container"

description: |
  Checks out the commit under test (GITHUB_SHA: the PR merge commit on pull_request, the pushed/scheduled commit
  otherwise) in the image's clone /struphy_fortran_ and installs it into env_fortran_. Dependencies already in the
  image are only updated if the new requirements are not satisfied.

runs:
  using: composite
  steps:
    - name: Install struphy
      shell: bash
      run: |
          cd /struphy_fortran_
          git config --global --add safe.directory /struphy_fortran_
          # origin/devel is the diff base of the submodule and testmon checks (submodule-diff, changes_testmon_cannot_see.sh)
          git fetch --no-tags origin "+refs/heads/devel:refs/remotes/origin/devel"
          # the tested commit itself (a PR merge commit is not on any branch, but can be fetched by its SHA)
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          git log -1 --oneline
          git status
          source env_fortran_/bin/activate
          which python3
          pip install -e ".[phys,mpi,doc]"
          PYTHON=$(which python)
          STRUPHY_PATH=$($PYTHON -c 'import importlib.util; import os; print(os.path.dirname(importlib.util.find_spec("struphy").origin))')
          echo "Struphy is installed at: $STRUPHY_PATH"
          echo "STRUPHY_PATH=${STRUPHY_PATH}" >> $GITHUB_ENV
