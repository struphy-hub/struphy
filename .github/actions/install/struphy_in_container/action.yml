name: "Install Struphy in Container"

description: 

runs:
  using: composite
  steps:
    - name: Git branch name
      id: git-branch-name
      uses: EthanSK/git-branch-name-action@v1
    - name: Echo the branch name
      shell: bash
      run: echo "Branch name ${GIT_BRANCH_NAME}"
    - name: Install struphy
      shell: bash
      run: |
          ls / -a
          which python3
          cd /struphy_fortran_
          git status
          git fetch origin
          echo ${GIT_BRANCH_NAME}
          git checkout ${GIT_BRANCH_NAME}
          git pull
          source env_fortran_/bin/activate
          which python3
          pip install -e ".[phys,mpi,doc]"
          PYTHON=$(which python)
          STRUPHY_PATH=$($PYTHON -c "import struphy; print(struphy.__path__[0])")
          echo "Struphy is installed at: $STRUPHY_PATH"
          echo "STRUPHY_PATH=${STRUPHY_PATH}" >> $GITHUB_ENV