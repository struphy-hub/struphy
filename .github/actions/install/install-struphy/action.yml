name: "Install struphy in env"

description: 

inputs:
  optional-deps:
    required: true
    default: 'dev'

runs:
  using: composite
  steps:

    - name: Install struphy
      shell: bash
      run: |
        pip install --upgrade pip
        pip install ".[${{ inputs.optional-deps }}]"
        pip list
        struphy -h
        PYTHON=$(which python)
        STRUPHY_PATH=$($PYTHON -c "import struphy; print(struphy.__path__[0])")
        echo "Struphy is installed at: $STRUPHY_PATH"
        echo "STRUPHY_PATH=${STRUPHY_PATH}" >> $GITHUB_ENV
