name: "Run unit tests"

description: 

inputs:
  dir-name:
    default: ""
  env-name:
    default: ""

runs:
  using: composite
  steps:
    - name: Run unit tests (serial) in container
      shell: bash
      env:
        TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-unit
      run: |
        set +e
        source ${{ inputs.dir-name }}${{ inputs.env-name }}bin/activate || true
        set -e
        pip show struphy
        struphy compile --status
        cd ${{ inputs.dir-name }}src/struphy
        pwd
        echo "Running $RUN_MAXWELL"
        $RUN_MAXWELL
        echo "Running $UNINSTALL_MPI"
        $UNINSTALL_MPI
        git status || true
        echo "Running $PYTEST_CMD"
        $PYTEST_CMD
