name: "Run unit tests"

description: 

inputs:
  env-name:
    required: true
    default: ""

runs:
  using: composite
  steps:
    - name: Run unit tests (serial) in container
      shell: bash
      env:
        TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-unit
      run: |
        source {{ inputs.env-name }}/bin/activate || true
        which python
        struphy compile --status
        pip show mpi4py
        pip uninstall -y mpi4py
        cd src/struphy
        pytest --testmon \
        bsplines/tests/ \
        console/tests/ \
        feec/tests/ \
        fields_background/tests/ \
        geometry/tests/ \
        initial/tests/ \
        kinetic_background/tests/ \
        linear_algebra/tests/ \
        ode/tests/ \
        pic/tests/ \
        polar/tests/ \
        post_processing/tests/ \
        propagators/tests/
