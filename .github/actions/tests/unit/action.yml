name: "Run unit tests"

description: 

inputs:
  struphy-path:
    required: true
  env-name:
    default: ""

runs:
  using: composite
  steps:
    - name: Run unit tests (serial) in container
      shell: bash
      env:
        TESTMON_DATAFILE: ${{ github.workspace }}/.testmondata-unit
        TEST_FILES: "bsplines/tests/ \
                    console/tests/ \
                    feec/tests/ \
                    fields_background/tests/ \
                    geometry/tests/ \
                    initial/tests/ \
                    kinetic_background/tests/ \
                    linear_algebra/tests/ \
                    ode/tests/ \
                    pic/tests/ \
                    polar/tests/ \
                    post_processing/tests/ \
                    propagators/tests/"
      run: |
        set +e
        source ${{ inputs.env-name }}/bin/activate || true
        set -e
        pip show struphy
        struphy compile --status
        cd ${{ inputs.struphy-path }}
        pwd
        echo "Running $RUN_MAXWELL"
        $RUN_MAXWELL
        echo "Running $UNINSTALL_MPI"
        $UNINSTALL_MPI
        git status || true
        echo "Running $PYTEST_CMD $TEST_FILES"
        $PYTEST_CMD
