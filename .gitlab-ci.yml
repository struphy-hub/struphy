# GPU-only CI for struphy on the MPCDF GitLab (https://gitlab.mpcdf.mpg.de).
#
# This file is used only by the MPCDF GitLab mirror, which exists to run the CUDA tests on
# MPCDF's NVIDIA GPU runners. Everything else (install matrices, CPU unit/MPI tests, lint,
# docs, releases, images) runs in GitHub Actions (.github/workflows).
#
# How to trigger:
#   - push any branch to the GitLab remote:  git push <mpcdf-remote> <branch>
#   - or "Build > Pipelines > Run pipeline" in the GitLab web UI.
# Merge requests, tags and schedules do not start pipelines.
#
# Backends: the struphy tests and the feectools parity tests switch between NumPy and CuPy
# themselves (cunumpy.use_backend), so they run with the default (NumPy) backend. The
# feectools device tests use the *active* backend, so they run with CUNUMPY_BACKEND=cupy.
# A missing GPU makes `requires_cupy` skip tests; the preflight and the junit check below
# turn that into a failure instead (CUNUMPY_REQUIRE_CUDA is set as well, but at the
# moment only cunumpy's own test suite reads it).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  # MPCDF image with the NVIDIA HPC SDK (CUDA 13 driver stack); same as in cunumpy's GPU CI.
  CUDA_IMAGE: "gitlab-registry.mpcdf.mpg.de/mpcdf/ci-module-image/nvhpcsdk_26:2026"
  GIT_SUBMODULE_STRATEGY: recursive  # feectools is a submodule; its tests run from it
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CUNUMPY_REQUIRE_CUDA: "1"
  STRUPHY_COMPILE_LANGUAGE: "c"
  STRUPHY_COMPILE_JOBS: "8"

stages:
  - setup
  - test

# --- shared pieces ---

# Every job runs on a fresh GPU runner, so each one builds the environment: Python venv,
# CuPy for CUDA 13, struphy (editable, dev extras), feectools from the submodule, and the
# pyccel kernels (struphy compile also compiles the feectools kernels via psydac-accelerate).
.gpu_job:
  image: ${CUDA_IMAGE}
  tags:
    - gpu-nvidia
    - gpu-nvidia-cc80
  interruptible: true
  cache:
    key: pip-gpu
    paths:
      - .cache/pip
  before_script:
    - module load python-waterboa/2025.06
    - module load nvhpcsdk/26
    - module load gcc/14  # gcc/gfortran for the pyccel kernels
    - nvidia-smi
    - python3 -m venv .venv-gpu
    - source .venv-gpu/bin/activate
    - python -m pip install -U pip
    # Keep NVRTC, CUDA libraries and headers on the same toolkit generation (not the `gpu`
    # extra, which still pins cupy-cuda12x).
    - python -m pip install "cupy-cuda13x[ctk]" "cuda-toolkit==13.2.*"
    # mpi4py against the image's MPI if it has an MPI compiler wrapper, else the PyPI wheel.
    - if command -v mpicc; then MPICC=mpicc python -m pip install --no-binary=mpi4py "mpi4py<=4.1.1"; fi
    - python -m pip install -e ".[dev]"
    - python -m pip install -e ./feectools  # the submodule version, not the PyPI pin
    - python -c "import cupy; cupy.show_config()"
    # Fail early if CuPy cannot launch kernels (tests would otherwise be skipped).
    - python -c "import cunumpy; assert cunumpy.cupy_available(), 'CuPy cannot use a GPU'"
    - struphy compile -y --language "$STRUPHY_COMPILE_LANGUAGE" -j "$STRUPHY_COMPILE_JOBS"
    - struphy compile --status
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - junit-*.xml
    reports:
      junit: junit-*.xml

# Fails the job if any test was skipped for lack of a GPU (requires_cupy, feectools device binding).
.snippets:
  check_no_gpu_skips: &check_no_gpu_skips |
    if grep -l -e "CuPy/GPU not available" -e "fake CuPy" -e "only happens on the CuPy backend" junit-*.xml; then
      echo "GPU tests were skipped: no usable GPU in this job"; exit 1
    fi

# --- jobs ---

# Builds the environment once and prints the GPU/CuPy/MPI setup, so environment problems
# fail here, before the test jobs start.
setup_gpu:
  extends: .gpu_job
  stage: setup
  script:
    - pip list
    - python -c "import cunumpy; print('cunumpy', cunumpy.__version__, 'backend', cunumpy.get_backend())"
    - python -c "from maybempi import MPI; print('MPI:', MPI)"
    - which mpirun || echo "no mpirun in this image"

# struphy's CUDA tests: CUDA vs pyccel kernel parity, device helpers, kernel argument classes,
# CPU emulation of the CUDA kernels, reflection, spline evaluation, Derham and domain on CuPy.
# The tests select the CuPy backend themselves, so the default backend stays NumPy.
struphy_gpu_tests:
  extends: .gpu_job
  stage: test
  needs: [setup_gpu]
  script:
    - >-
      python -m pytest -v -ra --junitxml=junit-struphy.xml
      src/struphy/pic/tests/test_cuda_parity.py
      src/struphy/pic/tests/test_device_helpers.py
      src/struphy/pic/tests/test_kernel_backends.py
      src/struphy/pic/tests/test_cuda_emulation.py
      src/struphy/pic/tests/test_reflect.py
      src/struphy/bsplines/tests/test_evaluation_cuda.py
      src/struphy/feec/tests/test_derham_gpu.py
      src/struphy/geometry/tests/test_domain.py
    - *check_no_gpu_skips

# feectools' CUDA tests (from the submodule). Parity/emulation switch backends themselves;
# the stencil matvec, single-rank MPI device and device-binding tests use the active
# backend, so they run with CUNUMPY_BACKEND=cupy.
feectools_gpu_tests:
  extends: .gpu_job
  stage: test
  needs: [setup_gpu]
  script:
    - >-
      python -m pytest -v -ra --junitxml=junit-feectools-parity.xml
      feectools/feectools/linalg/tests/test_cuda_parity.py
      feectools/feectools/linalg/tests/test_cuda_emulation.py
    - >-
      CUNUMPY_BACKEND=cupy python -m pytest -v -ra --with-mpi --junitxml=junit-feectools-device.xml
      feectools/feectools/linalg/tests/test_device_matvec.py
      feectools/feectools/linalg/tests/test_mpi_device.py
      feectools/feectools/ddm/tests/test_device_binding.py
    - *check_no_gpu_skips

# 2 MPI ranks on the GPU: ghost exchanges of device arrays (feectools) and struphy's
# MPI-aware GPU tests. Needs an MPI (mpirun + mpicc for mpi4py) in the image, ideally
# CUDA-aware; each rank binds GPU local_rank % n_gpus (bind_local_device), so with one GPU
# both ranks share it. Manual and allowed to fail until the runner setup is confirmed.
mpi_gpu_tests:
  extends: .gpu_job
  stage: test
  needs: [setup_gpu]
  when: manual
  allow_failure: true
  variables:
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  script:
    - nvidia-smi -L
    - ompi_info --parsable --all 2>/dev/null | grep -i "mpi_built_with_cuda_support" || echo "CUDA-aware MPI unknown"
    # One junit file per rank (OMPI_COMM_WORLD_RANK is set by Open MPI's mpirun).
    - >-
      CUNUMPY_BACKEND=cupy mpirun -n 2 --oversubscribe sh -c
      'python -m pytest -v -ra -p no:cacheprovider --with-mpi --junitxml=junit-feectools-mpi-$OMPI_COMM_WORLD_RANK.xml
      feectools/feectools/linalg/tests/test_mpi_device.py
      feectools/feectools/ddm/tests/test_device_binding.py'
    - >-
      mpirun -n 2 --oversubscribe sh -c
      'python -m pytest -v -ra -p no:cacheprovider --with-mpi --junitxml=junit-struphy-mpi-$OMPI_COMM_WORLD_RANK.xml
      src/struphy/feec/tests/test_derham_gpu.py
      src/struphy/pic/tests/test_kernel_backends.py
      src/struphy/pic/tests/test_reflect.py
      src/struphy/pic/tests/test_cuda_parity.py'
    - *check_no_gpu_skips
